<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA STEF — Logistique du Froid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #003189;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .badge {
            background: #F16E00;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }

        .avatar.agent { background: #003189; color: white; }
        .avatar.user { background: #F16E00; color: white; }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.agent .bubble {
            background: white;
            color: #1a1a1a;
            border-radius: 4px 16px 16px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .message.user .bubble {
            background: #003189;
            color: white;
            border-radius: 16px 4px 16px 16px;
        }

        .horodatage {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            text-align: right;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 4px 16px 16px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            width: fit-content;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #003189;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        #input-area {
            background: white;
            padding: 16px 24px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #question-input {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        #question-input:focus { border-color: #003189; }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        #send-btn {
            background: #003189;
            color: white;
            padding: 12px 24px;
        }

        #send-btn:hover { background: #002070; }
        #send-btn:disabled { background: #ccc; cursor: not-allowed; }

        #save-btn {
            background: #f0f2f5;
            color: #595959;
        }

        #save-btn:hover { background: #e0e0e0; }

        #reset-btn {
            background: #fff0e6;
            color: #F16E00;
        }

        #reset-btn:hover { background: #ffe0cc; }

        .message-bienvenue {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 20px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .suggestion {
            background: white;
            border: 1.5px solid #003189;
            color: #003189;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion:hover {
            background: #003189;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Agent IA STEF</h1>
        <p>Logistique du Froid — Assistant intelligent</p>
    </div>
    <span class="badge">RAG · Llama 3.3</span>
</header>

<div id="chat-container">
    <div class="message-bienvenue">
        <p>Bonjour ! Je suis l'assistant IA de STEF. Posez-moi vos questions sur la logistique du froid.</p>
        <div class="suggestions">
            <span class="suggestion" onclick="poserQuestion(this)">Température transport surgelés ?</span>
            <span class="suggestion" onclick="poserQuestion(this)">Quels sont les KPI de STEF ?</span>
            <span class="suggestion" onclick="poserQuestion(this)">Comment l'IA peut aider STEF ?</span>
            <span class="suggestion" onclick="poserQuestion(this)">Qui sont les clients de STEF ?</span>
        </div>
    </div>
</div>

<div id="input-area">
    <input 
        type="text" 
        id="question-input" 
        placeholder="Posez votre question..." 
        onkeypress="if(event.key==='Enter') envoyerQuestion()"
    />
    <button id="send-btn" onclick="envoyerQuestion()">Envoyer</button>
    <button id="save-btn" onclick="sauvegarder()">Sauvegarder</button>
    <button id="reset-btn" onclick="reinitialiser()">Nouvelle session</button>
</div>

<script>
    function poserQuestion(el) {
        document.getElementById('question-input').value = el.textContent;
        envoyerQuestion();
    }

    function ajouterMessage(role, texte) {
        const container = document.getElementById('chat-container');
        const now = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
        
        const div = document.createElement('div');
        div.className = `message ${role}`;
        
        const initiale = role === 'user' ? 'V' : 'S';
        const label = role === 'user' ? 'user' : 'agent';
        
        div.innerHTML = `
            <div class="avatar ${label}">${initiale}</div>
            <div>
                <div class="bubble">${texte.replace(/\n/g, '<br>')}</div>
                <div class="horodatage">${now}</div>
            </div>
        `;
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function afficherTyping() {
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = 'message agent';
        div.id = 'typing-indicator';
        div.innerHTML = `
            <div class="avatar agent">S</div>
            <div class="typing">
                <span></span><span></span><span></span>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function supprimerTyping() {
        const typing = document.getElementById('typing-indicator');
        if (typing) typing.remove();
    }

    async function envoyerQuestion() {
        const input = document.getElementById('question-input');
        const question = input.value.trim();
        if (!question) return;

        input.value = '';
        document.getElementById('send-btn').disabled = true;

        ajouterMessage('user', question);
        afficherTyping();

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            
            const data = await response.json();
            supprimerTyping();
            ajouterMessage('agent', data.reponse);
        } catch (error) {
            supprimerTyping();
            ajouterMessage('agent', 'Une erreur est survenue. Veuillez réessayer.');
        }

        document.getElementById('send-btn').disabled = false;
        input.focus();
    }

    async function sauvegarder() {
        const response = await fetch('/sauvegarder', { method: 'POST' });
        const data = await response.json();
        alert(data.message);
    }

    async function reinitialiser() {
        await fetch('/reinitialiser', { method: 'POST' });
        const container = document.getElementById('chat-container');
        container.innerHTML = `
            <div class="message-bienvenue">
                <p>Nouvelle session démarrée. Posez votre question.</p>
            </div>
        `;
    }
</script>

</body>
</html>
